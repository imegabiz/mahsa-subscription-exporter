name: Update subscription

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Export configs
        run: python -m src.mahsa_exporter

      - name: Commit configs.txt
        run: |
          if [ -z "$(git status --porcelain -- configs.txt)" ]; then
            echo "configs.txt unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- configs.txt
          git commit -m "Update configs.txt" -- configs.txt
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), rebasing and retrying."
            if ! git pull --rebase origin "${branch}"; then
              git rebase --abort || true
              echo "Rebase conflict; leaving repository untouched."
              exit 1
            fi
          done
          echo "Push failed after 3 attempts."
          exit 1
